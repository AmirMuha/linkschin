openapi: 3.0.3
info:
  title: Linkschin Extraction Dead Letter Queue (DLQ) API
  version: 0.2.0
  description: Administrative endpoints for inspecting and re-processing failed AI extractions (User Story 7).
paths:
  /api/admin/dlq:
    get:
      summary: List dead-letter queue items (Operator Auth)
      operationId: listDlqItems
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, resolved, failed]
            default: pending
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [movies, games, music]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of DLQ items
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DlqItem'
                  total:
                    type: integer
        '401':
          description: Unauthorized

  /api/admin/dlq/{id}/retry:
    post:
      summary: Manually trigger re-extraction for a specific DLQ item (Operator Auth)
      operationId: retryDlqItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Re-extraction result
          content:
            application/json:
              schema:
                type: object
                required: [id, success, message]
                properties:
                  id:
                    type: integer
                  success:
                    type: boolean
                  message:
                    type: string
                  media_item_id:
                    type: string
                    nullable: true
        '401':
          description: Unauthorized
        '404':
          description: DLQ item not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DlqItem:
      type: object
      required: [id, source_id, page_url, category, error_message, status, retry_count, created_at]
      properties:
        id:
          type: integer
        source_id:
          type: string
        page_url:
          type: string
        category:
          type: string
        error_message:
          type: string
        model_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, resolved, failed]
        retry_count:
          type: integer
        next_retry_at:
          type: number
        created_at:
          type: number
        resolved_at:
          type: number
          nullable: true
